<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Order</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="page-data" data-filaments="[]" style="display:none;"></div>

  <div id="featured-order-modal" class="modal open">
    <div class="modal-backdrop" id="featured-modal-backdrop"></div>
    <div class="config-modal-content" role="dialog" aria-modal="true" aria-labelledby="featured-modal-title">
      <div class="config-media">
        <div id="featured-modal-image" class="config-media-image"></div>
      </div>
      <div class="config-form">
        <h3 id="featured-modal-title" class="config-headline">Featured Print</h3>
        <p id="featured-modal-description" class="config-copy"></p>
        <p id="featured-modal-price" class="config-price">Rp0</p>

        <section class="config-section">
          <p class="config-section-title">Print Profile</p>
          <div id="featured-modal-profile-pills" class="profile-pills"></div>
          <div id="featured-modal-profile-select-wrap" class="profile-select-wrap">
            <select id="featured-modal-profile-select" class="profile-select"></select>
          </div>
        </section>

        <section class="config-section">
          <p class="config-section-title">Part Colors</p>
          <div id="featured-modal-parts" class="parts-stack"></div>
        </section>

        <p id="featured-modal-status" class="config-status" aria-live="polite"></p>

        <div class="config-actions">
          <button type="button" id="featured-modal-cancel" class="muted-btn">Cancel</button>
          <button type="button" id="featured-modal-confirm" class="browse-card-btn">Confirm & Add To Cart</button>
        </div>
      </div>
    </div>
  </div>

  <div id="cart-backdrop" class="cart-backdrop" role="presentation"></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Shopping cart">
    <div class="cart-drawer-header">
      <h2 class="cart-drawer-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Current Cart
      </h2>
      <button id="cart-drawer-close" class="cart-drawer-close" type="button" aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-drawer-body" id="cart-drawer-body"></div>
    <div class="cart-drawer-footer">
      <hr class="cart-footer-rule">
      <div id="cart-select-row" class="cart-select-row">
        <label class="cart-select-all">
          <input id="cart-select-all" type="checkbox" checked>
          Select all
        </label>
        <span id="cart-selected-count" class="cart-selected-count">0 selected</span>
      </div>
      <div id="cart-total-row" class="cart-total-row">
        <span>Total Estimate</span>
        <span class="cart-total-price" id="cart-total-price">Rp0</span>
      </div>
      <p id="cart-feedback" class="cart-feedback" aria-live="polite"></p>
      <button id="cart-checkout-btn" class="cart-checkout-btn" type="button" data-empty="true">Proceed to Checkout</button>
      <a id="cart-view-btn" href="#" class="cart-view-btn">View Full Cart</a>
    </div>
  </aside>

  <script src="overlay.js"></script>
</body>
</html>
